    <nav>
        <a href="index.html" class="nav-link">Home</a>
        <a href="artists.html" class="nav-link active">Artists</a>
        <a href="clothing.html" class="nav-link">Clothing</a>
    </nav>

    <button class="icon-btn" onclick="toggleCart()">
        <i class="fas fa-bag-shopping"></i>
        <span id="cart-count" class="cart-count">0</span>
    </button>
</header>

<!-- ================= ARTISTS SECTION ================= -->
<section class="artists-section">

    <div class="section-header">
        <h2>The Resistance Gallery</h2>
        <p>Tap any legend to uncover their legacy</p>
    </div>

    <div class="artist-grid">

        <!-- ================= ARTIST CARD ================= -->
        <section class="artist-grid">

<div class="artist-card" onclick="toggleBio(this)">
<img src="images/masekela.jpg">

<div class="artist-overlay">
<h3>Hugh Masekela</h3>
</div>

<div class="artist-expanded">
<h3>Hugh Masekela</h3>
<p>Trumpeter • Activist</p>

<p>Music was resistance.</p>

<p class="artist-quote">“Sound is memory.”</p>

<button onclick="addPosterToCart('Poster',150,this)">
Add Poster – R150
</button>
</div>

</div>

</section>
        </div>

    </div>
</section>

<!-- ================= TOAST ================= -->
 <div id="sheetOverlay" class="sheet-overlay" onclick="closeSheet()"></div>

<div id="toast" class="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toast-text"></span>
</div>

<!-- ================= CART ================= -->
<div id="cartOverlay" class="cart-overlay-bg" onclick="closeCart()"></div>

<div id="cartDrawer" class="cart-drawer">
    <button class="close-cart" onclick="closeCart()">
        <i class="fas fa-times"></i>
    </button>

    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <h3 id="total">Total: R0</h3>

    <button class="checkout-btn" onclick="payNow()">
        Checkout with PayFast
    </button>
</div>
